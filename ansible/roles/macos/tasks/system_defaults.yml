---
- name: Save screenshots to ~/Downloads instead of the Desktop
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: location
    type: string
    value: "{{ ansible_facts.env.HOME }}/Downloads"
    state: present
  notify: Restart SystemUIServer

- name: Mute the screenshot shutter sound
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: disable-sound
    type: bool
    value: true
    state: present
  notify: Restart SystemUIServer

- name: Set the system language to English (US)
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleLanguages
    type: array
    value:
      - en-US
    state: present

- name: Set the system locale to en_US
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleLocale
    type: string
    value: en_US
    state: present

# The enabled-input-sources order decides which keyboard is active at login;
# U.S. must come first or macOS starts in the Pinyin input method.
# osx_defaults can't compare arrays of dicts (it builds a set), so read/compare/write by hand.
- name: Read current HIToolbox input sources
  ansible.builtin.shell: |
    defaults export com.apple.HIToolbox - | plutil -extract {{ item.key }} json -o - - 2>/dev/null || echo '[]'
  loop: "{{ hitoolbox_input_sources | dict2items }}"
  register: hitoolbox_current
  changed_when: false
  failed_when: false

- name: Set HIToolbox input sources (U.S. first) when they differ
  ansible.builtin.shell: |
    printf '%s' '{{ item.item.value | to_json }}' | python3 -c '
    import json, plistlib, sys
    xml = plistlib.dumps(json.load(sys.stdin)).decode()
    sys.stdout.write(xml[xml.index("<array>"):xml.rindex("</plist>")])
    ' | xargs -0 defaults write com.apple.HIToolbox {{ item.item.key }}
  loop: "{{ hitoolbox_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: (item.stdout | from_json) != item.item.value

- name: Set the current keyboard layout to U.S. English
  community.general.osx_defaults:
    domain: com.apple.HIToolbox
    key: AppleCurrentKeyboardLayoutInputSourceID
    type: string
    value: com.apple.keylayout.US
    state: present
