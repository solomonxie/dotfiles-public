# Seeded to ~/.gitconfig by ansible (never overwritten). Then set your identity:
#   $ git config --global user.name "YourName"
#   $ git config --global user.email "you@example.com"
[user]
	name = YourName
	email = you@example.com
[include]
	path = ~/.dotfiles/etc/git/gitconfig-extra.ini
[init]
	defaultBranch = master
